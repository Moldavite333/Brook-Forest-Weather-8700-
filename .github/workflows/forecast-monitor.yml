name: Collect Weather Forecast Accuracy
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/forecast-monitor.cjs'
      - '.github/workflows/forecast-monitor.yml'
permissions:
  contents: write
concurrency:
  group: weather-accuracy-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture predictions and match observations
        id: collector
        continue-on-error: true
        run: node scripts/forecast-monitor.cjs
      - name: Store permanent verification snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification.json
          if git diff --cached --quiet; then
            echo "No new monitoring data."
          else
            git commit -m "Update Brook Forest forecast verification archive [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report source failures
        if: steps.collector.outcome == 'failure'
        run: echo "::warning::Forecast monitoring failed to collect new predictions; saved status is available in the verification archive."
